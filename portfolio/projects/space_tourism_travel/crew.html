<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700&family=Bellefair&family=Barlow:wght@400;700&display=swap"
      rel="stylesheet">

  <link rel="stylesheet" href="index.css">
  <title>Space Tourism Website | Crew</title>

  <script src="index.js" defer></script>
</head>
<body class="crew">
    <a class="skip-to-content" href="#main">Skip to content</a>
    <header class="primary-header flex">
      <div>
          <img src="./assets/shared/logo.svg" alt="Space tourism logo" class="logo">
      </div>
      <button class="mobile-nav-toggle" aria-controls="primary-navigation" aria-expanded="false"><span class="sr-only">Menu</span></button>
      <nav>
        <ul id="primary-navigation" class="primary-navigation underline-indicators flex">
          <li><a class="uppercase ff-sans-cond text-white letter-spacing-2" href="index.html"><span aria-hidden="true">00</span>Home</a></li>
          <li><a class="uppercase ff-sans-cond text-white letter-spacing-2" href="destination.html"><span aria-hidden="true">01</span>Destination</a></li>
          <li class="active"><a class="uppercase ff-sans-cond text-white letter-spacing-2" href="crew.html"><span aria-hidden="true">02</span>Crew</a></li>
          <li><a class="uppercase ff-sans-cond text-white letter-spacing-2" href="technology.html"><span aria-hidden="true">03</span>Technology</a></li>
        </ul>
      </nav>
    </header>

  <main id="main" class="grid-container grid-container--crew flow">
    <h1 class="numbered-title"><span aria-hidden="true">02</span> Meet your crew</h1>

    <picture id="crew-image">
      <source srcset="./assets/crew/image-douglas-hurley.webp" media="(min-width: 45em)">
      <img src="./assets/crew/image-douglas-hurley.png" alt="Douglas Hurley">
    </picture>

    <div class="dot-indicators flex" role="tablist" aria-label="crew member list">
      <button aria-selected="true" role="tab" tabindex="0" data-crew="douglas"><span class="sr-only">Douglas Hurley</span></button>
      <button aria-selected="false" role="tab" tabindex="-1" data-crew="mark"><span class="sr-only">Mark Shuttleworth</span></button>
      <button aria-selected="false" role="tab" tabindex="-1" data-crew="victor"><span class="sr-only">Victor Glover</span></button>
      <button aria-selected="false" role="tab" tabindex="-1" data-crew="anousheh"><span class="sr-only">Anousheh Ansari</span></button>
    </div>

    <article class="crew-info flow">
      <h2 id="crew-role" class="fs-600 ff-serif uppercase text-white" style="opacity:.5">Commander</h2>
      <p id="crew-name" class="fs-700 ff-serif uppercase">Douglas Hurley</p>
      <p id="crew-bio">Douglas Hurley is an American engineer, former Marine Corps pilot and former NASA astronaut. He launched into space for the third time as commander of Crew Dragon Demo-2.</p>
    </article>
  </main>

</body>
</html>
